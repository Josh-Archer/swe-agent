apiVersion: v1
kind: Service
metadata:
  name: ai-agent-service
spec:
  selector:
    app: ai-agent
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
  # Public entrypoint. /api/resolve and /api/generate reject calls that do
  # not present API_KEY (X-API-Key or Authorization: Bearer). Create the
  # ai-agent-secrets Secret referenced by the Deployment before exposing this
  # Service. For in-cluster clients only, set type to ClusterIP and apply
  # networkpolicy.yaml. The API key check still applies either way.
  type: LoadBalancer