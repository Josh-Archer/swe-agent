apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-agent-deployment
  labels:
    app: ai-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-agent
  template:
    metadata:
      labels:
        app: ai-agent
    spec:
      containers:
      - name: ai-agent
        # IMPORTANT: Replace this with the path to your container image
        # For example, if using GHCR: ghcr.io/YOUR_USERNAME/YOUR_REPONAME:latest
        image: ghcr.io/jules-labs/k3s-deployable-agent:latest
        ports:
        - containerPort: 8000
        env:
        - name: OLLAMA_MODEL
          value: "llama2" # Or whichever model you prefer
        # This assumes Ollama is running and accessible at this address.
        # If running Ollama in the same cluster, you can use its service name.
        - name: OLLAMA_HOST
          value: "http://ollama-service:11434"
        # Liveness: process is up (does not require the model).
        livenessProbe:
          httpGet:
            path: /
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        # Startup: wait until the configured model is pulled before marking started.
        # Allows a long window so operators can pull the model after Ollama is up.
        startupProbe:
          httpGet:
            path: /ready
            port: 8000
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 36  # up to ~6 minutes
        # Readiness: only receive traffic when the model is available.
        readinessProbe:
          httpGet:
            path: /ready
            port: 8000
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
